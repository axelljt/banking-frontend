<div class="container-fluid">
  <h3 class="text-secondary mb-4">Gestión de Cuentas</h3>

  <div *ngIf="clientesConCuentas.length === 0" class="alert alert-warning">
    Esperando datos del servidor... revisa la consola (F12) si esto no desaparece.
  </div>

  <div class="row">
    <div class="col-md-6 col-lg-4 mb-4" *ngFor="let cliente of clientesConCuentas">
      <div class="card shadow-sm border-0 bg-light">
        <div class="card-body">
          <h5 class="card-title text-primary">{{ cliente.nombre }} {{ cliente.apellido }}</h5>
          <hr>
          
          <div *ngFor="let cuenta of cliente?.cuentas" class="card mb-2 border-start border-4 border-info">
            <div class="card-body p-2">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <small class="text-muted d-block">Número de Cuenta</small>
                  <strong>{{ cuenta.numeroCuenta }}</strong>
                </div>
                <span class="badge bg-info-subtle text-info border border-info">{{ cuenta.tipoCuenta }}</span>
              </div>
              <div class="mt-2">
                <small class="text-muted d-block">Saldo Actual</small>
                <h5 class="text-dark mb-0">{{ cuenta.saldo | currency:'USD' }}</h5>
              </div>
            </div>
          </div>

          <div *ngIf="!cliente.cuentas || cliente.cuentas.length === 0" class="text-center p-3">
             <span class="text-muted small italic">Sin cuentas registradas</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
