<div class="card shadow-sm border-0 p-4">
  <h4 class="text-primary mb-4">Nueva Transacción</h4>
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Número de Cuenta</label>
      <input type="text" class="form-control" [(ngModel)]="movimiento.cuentaId" placeholder="Ej: 478758">
    </div>
    <div class="col-md-6">
      <label class="form-label">Tipo</label>
      <select class="form-select" [(ngModel)]="movimiento.tipoMovimiento">
        <option value="Deposito">Depósito (+)</option>
        <option value="Retiro">Retiro (-)</option>
      </select>
    </div>
    <div class="col-md-12">
      <label class="form-label">Valor (Monto)</label>
      <div class="input-group">
        <span class="input-group-text">$</span>
        <input type="number" class="form-control" [(ngModel)]="movimiento.valor">
      </div>
    </div>
    <div class="col-12 mt-4">
      <button class="btn btn-primary w-100 py-2" (click)="ejecutar()">Procesar Movimiento</button>
    </div>
  </div>
</div>
